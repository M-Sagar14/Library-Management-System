<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart AI UI Clone</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Helvetica Neue', sans-serif;
      background: #f7f7f8;
      color: #202123;
    }
    body.dark {
      background: #202123;
      color: #e6e6e6;
    }

    .app {
      display: flex;
      height: 100vh;
      position: relative;
      background: #f7f7f8;
      margin-left: 0; /* no sidebar in layout flow */
      transition: margin-left 0.3s ease;
    }
    body.dark .app {
      background: #202123;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: #202123;
      color: white;
      display: flex;
      flex-direction: column;
      padding: 1rem 0;
      transition: left 0.3s ease;
      position: fixed; /* fixed so can move offscreen */
      top: 0;
      left: 0;
      height: 100vh;
      z-index: 10;
    }
    body.light .sidebar {
      background: #ffffff;
      color: #202123;
      border-right: 1px solid #ddd;
    }

    .sidebar.hidden {
      left: -260px;
      background: transparent;
      pointer-events: none;
    }

    .sidebar-header {
      font-weight: bold;
      font-size: 1.25rem;
      padding: 0 1rem 1rem;
      border-bottom: 1px solid #444;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    body.light .sidebar-header {
      border-color: #eee;
    }

    .close-sidebar-btn {
      background: transparent;
      border: none;
      color: #ccc;
      font-size: 20px;
      cursor: pointer;
      padding: 0 6px;
      transition: color 0.2s ease;
    }
    .close-sidebar-btn:hover {
      color: #fff;
    }

    .sidebar button {
      margin: 0.5rem 1.5rem;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      background: #3e3e42;
      color: white;
      border: none;
      cursor: pointer;
      text-align: left;
    }
    body.light .sidebar button {
      background: #e2e2e6;
      color: #333;
    }

    .chats-list {
      flex-grow: 1;
      overflow-y: auto;
      padding: 0 1rem;
    }

    .chat-item {
      position: relative;
      padding: 0.6rem 2.5rem 0.6rem 1rem;
      border-radius: 6px;
      margin: 0.25rem 0;
      cursor: pointer;
      color: #ccc;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-item:hover {
      background: #5a5a62;
      color: white;
    }
    body.light .chat-item {
      color: #333;
    }
    body.light .chat-item:hover {
      background: #e0e0e0;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 16px;
      padding: 0 4px;
      transition: color 0.2s ease;
    }
    .delete-btn:hover {
      color: #ff4b4b;
    }

    /* Chat Area */
    .chat-area {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: inherit; /* same as .app for color match */
      margin-left: 0;
      transition: margin-left 0.3s ease;
      min-width: 0;
    }
    body.dark .chat-area {
      background: #343541;
    }

    .messages {
      flex-grow: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 1rem;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: #10a37f;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.bot {
      align-self: flex-start;
      background: #f0f0f0;
      color: #333;
      border-bottom-left-radius: 4px;
    }
    body.dark .message.bot {
      background: #444654;
      color: #e5e5e5;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 260px;
      right: 0;
      padding: 1rem;
      background: #ffffff;
      border-top: 1px solid #ddd;
      transition: left 0.3s ease;
      z-index: 5;
      max-width: calc(100% - 260px);
      margin: 0 auto;
      box-sizing: border-box;
    }
    body.dark .input-area {
      background: #343541;
      border-color: #444654;
    }

    .input-area.sidebar-hidden {
      left: 0;
      max-width: 100%;
    }

    .input-wrapper {
      max-width: 720px;
      margin: auto;
      position: relative;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 48px 14px 16px;
      font-size: 1rem;
      border-radius: 30px;
      border: 1px solid #ccc;
      outline: none;
      background: white;
      color: black;
    }
    body.dark input[type="text"] {
      background: #444654;
      color: white;
      border-color: #666;
    }

    .send-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: #10a37f;
      color: white;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 16px;
      cursor: pointer;
    }

    /* Hamburger open button */
    #openSidebarBtn {
      position: fixed;
      top: 12px;
      left: 12px;
      width: 36px;
      height: 36px;
      border: none;
      background: #10a37f;
      color: white;
      border-radius: 6px;
      font-size: 22px;
      cursor: pointer;
      display: none;
      z-index: 20;
      box-shadow: 0 2px 5px rgb(0 0 0 / 0.2);
    }
    #openSidebarBtn:hover {
      background: #0e8a68;
    }

    body.dark #openSidebarBtn {
      background: #2f855a;
    }
    .sidebar-btn {
    display: block;
    width: 85%;
    padding: 13px 0;
    margin: 10px auto;
    border-radius: 10px;
    background-color: transparent;
    color: #e0e0e0;
    font-size: 1rem;
    letter-spacing: 0.3px;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.25s ease;
}

.sidebar-btn:hover {
    background: linear-gradient(90deg, var(--primary-color), var(--primary-hover));
    color: white;
    transform: translateX(4px);
}
  </style>
</head>
<body class="light">
  <div class="app">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        Smart AI
        <button class="close-sidebar-btn" id="closeSidebarBtn" title="Close Sidebar">×</button>
      </div>
      <button id="{% url 'UserApp:dashboard' %}">🏠 Dashboard</button>
      <button id="newChatBtn">➕ New Chat</button>
      <div class="chats-list" id="chatList"></div>
      <button class="theme-toggle" id="themeToggle">🌓 Toggle Dark Mode</button>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chatArea">
      <div class="messages" id="messages"></div>
      <div class="input-area" id="inputArea">
        <div class="input-wrapper">
          <input type="text" id="userInput" placeholder="Send a message..." />
          <button class="send-btn" id="sendBtn" title="Send">➤</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Hamburger button to open sidebar -->
  <button id="openSidebarBtn" title="Open Sidebar">☰</button>

  <script>
    const chatList = document.getElementById('chatList');
    const messages = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const themeToggle = document.getElementById('themeToggle');
    const chatArea = document.getElementById('chatArea');
    const inputArea = document.getElementById('inputArea');
    const sidebar = document.getElementById('sidebar');
    const newChatBtn = document.getElementById('newChatBtn');
    const dashboardBtn = document.getElementById('dashboardBtn');
    const closeSidebarBtn = document.getElementById('closeSidebarBtn');
    const openSidebarBtn = document.getElementById('openSidebarBtn');

    let chats = [];
    let currentChatId = null;

    function createChatEntry(name, id) {
      const div = document.createElement('div');
      div.classList.add('chat-item');
      div.dataset.chatId = id;

      const nameSpan = document.createElement('span');
      nameSpan.textContent = name;
      nameSpan.style.flexGrow = '1';
      nameSpan.style.userSelect = 'none';

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.title = 'Delete chat';
      delBtn.innerHTML = '🗑️';

      delBtn.onclick = (e) => {
        e.stopPropagation();
        deleteChat(id);
      };

      div.appendChild(nameSpan);
      div.appendChild(delBtn);

      div.onclick = () => selectChat(id);

      return div;
    }

    function selectChat(id) {
      currentChatId = id;
      renderMessages();
    }

    function renderMessages() {
      messages.innerHTML = '';
      const chat = chats.find(c => c.id === currentChatId);

      if (chat) {
        chat.messages.forEach(({ text, sender }) => {
          const msgDiv = document.createElement('div');
          msgDiv.className = `message ${sender}`;
          msgDiv.textContent = text;
          messages.appendChild(msgDiv);
        });
      }

      messages.scrollTop = messages.scrollHeight;
    }

    function botResponse(userText) {
      return new Promise(res => {
        setTimeout(() => {
          res("🤖 You said: " + userText);
        }, 600);
      });
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      if (!currentChatId) {
        const id = `chat-${Date.now()}`;
        const title = text.slice(0, 25);
        chats.push({ id, name: title, messages: [] });
        chatList.appendChild(createChatEntry(title, id));
        currentChatId = id;
      }

      const chat = chats.find(c => c.id === currentChatId);
      chat.messages.push({ text, sender: 'user' });
      renderMessages();

      userInput.value = '';
      const reply = await botResponse(text);
      chat.messages.push({ text: reply, sender: 'bot' });
      renderMessages();
    }

    function deleteChat(id) {
      chats = chats.filter(c => c.id !== id);
      const chatDiv = chatList.querySelector(`[data-chat-id="${id}"]`);
      if (chatDiv) chatList.removeChild(chatDiv);

      if (currentChatId === id) {
        currentChatId = null;
        messages.innerHTML = '';
        userInput.value = '';
      }
    }

    themeToggle.onclick = () => {
      document.body.classList.toggle('dark');
      document.body.classList.toggle('light');
    };

    newChatBtn.onclick = () => {
      currentChatId = null;
      userInput.value = '';
      messages.innerHTML = '';
    };

    dashboardBtn.onclick = () => {
      if (sidebar.classList.contains('hidden')) {
        sidebar.classList.remove('hidden');
        inputArea.classList.remove('sidebar-hidden');
        openSidebarBtn.style.display = 'none';
      } else {
        sidebar.classList.add('hidden');
        inputArea.classList.add('sidebar-hidden');
        openSidebarBtn.style.display = 'block';
      }
    };

    closeSidebarBtn.onclick = () => {
      sidebar.classList.add('hidden');
      inputArea.classList.add('sidebar-hidden');
      openSidebarBtn.style.display = 'block';
    };

    openSidebarBtn.onclick = () => {
      sidebar.classList.remove('hidden');
      inputArea.classList.remove('sidebar-hidden');
      openSidebarBtn.style.display = 'none';
    };

    sendBtn.onclick = sendMessage;

    userInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    // Initialize theme mode on load
    document.body.classList.add('light');
  </script>
</body>
</html>
