<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | SmartLMS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

    :root {
      --bg-overlay: rgba(20, 0, 45, 0.6);
      --primary: #4e1088;
      --accent: #a855f7;
      --text: #1e1b4b;
      --card: #ffffff;
      --radius: 14px;
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 🔹 Animated Background Image */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5yGi5EzuqgBuFQUe5x3zSOTVED-GmPGaxGw&s') center/cover no-repeat;
      z-index: -2;
      animation: moveBg 40s linear infinite alternate;
      transform: scale(1.1);
    }

    /* 🔹 Gradient Overlay */
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--bg-overlay), rgba(40, 0, 90, 0.6));
      z-index: -1;
    }

    @keyframes moveBg {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    /* ---------- Container ---------- */
    .container {
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      overflow: hidden;
      width: 400px;
      max-width: 95%;
      padding: 3rem 2.5rem;
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .container h2 {
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    .container p {
      margin-bottom: 2rem;
      font-size: 0.95rem;
      color: #444;
      line-height: 1.5;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .input-group {
      position: relative;
    }

    .input-group input {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: 0.25s;
      background-color: #fff;
    }

    .input-group label {
      position: absolute;
      top: 50%;
      left: 1rem;
      transform: translateY(-50%);
      color: #64748b;
      pointer-events: none;
      transition: 0.25s;
      background: white;
      padding: 0 0.3rem;
    }

    .input-group input:focus,
    .input-group input:valid {
      border-color: var(--primary);
    }

    .input-group input:focus+label,
    .input-group input:valid+label {
      top: 0;
      font-size: 0.8rem;
      color: var(--primary);
    }

    button {
      padding: 0.9rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(147, 51, 234, 0.3);
    }

    .extra {
      margin-top: 1.5rem;
      font-size: 0.9rem;
    }

    .extra a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    .extra a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Forgot Password</h2>
    <p>Enter your email address below and we’ll send you password to reset your password.</p>
    <form action="#" method="post">
      {% csrf_token %}
      <div class="input-group">
        <input type="email" id="email" name="email" required>
        <label for="email">Email Address</label>
      </div>
      <button type="submit">Send Reset Password</button>
    </form>
    
  </div>
</body>

</html>
